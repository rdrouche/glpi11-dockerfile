build:
  stage: build
  image: docker:latest

  services:
    - name: docker:dind
      alias: dind

  variables:
    DOCKER_DRIVER: "overlay2"
    IMAGE_NAME: "rdrit/glpi"
    #IMAGE_TAG: "latest"

  before_script:
    - apk add --no-cache docker-cli
    - docker info
    - docker login -u $CI_HUB_DOCKER_LOGIN -p $CI_HUB_DOCKER_PASSWORD    
  script:
    - TAG_VERSION=latest
    - echo "Tag version ${TAG_VERSION:-'Aucun tag trouvé'}"
    - docker build -t $IMAGE_NAME:$TAG_VERSION -f Dockerfile --no-cache .
    #- docker push $IMAGE_NAME:$IMAGE_TAG
    - docker push $IMAGE_NAME:$TAG_VERSION
  rules:
    - if: '$CI_COMMIT_TAG'  # Toujours exécuter sur un tag
    - if: '$CI_COMMIT_BRANCH == "main"'
