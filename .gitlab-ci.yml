build:
  stage: build
  image: docker:latest

  services:
    - name: docker:dind
      alias: dind

  variables:
    DOCKER_DRIVER: "overlay2"
    IMAGE_NAME: "rdrit/glpi"
    #IMAGE_TAG: "latest"

  before_script:
    - apk add --no-cache docker-cli
    - docker info
    - docker login -u $CI_HUB_DOCKER_LOGIN -p $CI_HUB_DOCKER_PASSWORD    
  script:
    - |
      TAG_VERSION="$CI_COMMIT_TAG"

      echo "Tag Git détecté : ${TAG_VERSION}"

      if [[ "$TAG_VERSION" =~ ^beta- ]]; then
        echo "👉 Build BETA (pas de latest)"
        docker build \
          -t ${IMAGE_NAME}:${TAG_VERSION} \
          -f Dockerfile .

        docker push ${IMAGE_NAME}:${TAG_VERSION}
      elif [[ "$TAG_VERSION" =~ ^ubt24- ]]; then
        echo "👉 Build Ubuntu version"
        docker build \
          -t ${IMAGE_NAME}:${TAG_VERSION} \
          -f Dockerfile .

        docker push ${IMAGE_NAME}:${TAG_VERSION}
      else
        echo "🚀 Build Debian RELEASE (latest mis à jour)"
        docker build \
          -t ${IMAGE_NAME}:${TAG_VERSION} \
          -t ${IMAGE_NAME}:latest \
          -f Dockerfile .

        docker push ${IMAGE_NAME}:${TAG_VERSION}
        docker push ${IMAGE_NAME}:latest
      fi

  rules:
    - if: '$CI_COMMIT_TAG'  # Toujours exécuter sur un tag
    #- if: '$CI_COMMIT_BRANCH == "main"'
